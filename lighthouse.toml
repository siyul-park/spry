apiVersion = "lighthouse/v1alpha1"
kind = "Project"

[metadata]
name = "spry"

# Plugins resolve by id, not by path: lighthouse finds each plugin's
# `lighthouse-plugin.toml` and binary through its discovery rules, and `check`
# reports analysis as incomplete (exit 3) when one is missing. A contributor who
# builds lighthouse from source installs them with `make plugins` in
# https://github.com/siyul-park/lighthouse.
[spec]
plugins = [
  { id = "lang-go" },
  { id = "lang-markdown" },
  { id = "lang-python" },
  { id = "lang-yaml" },
  { id = "lang-toml" },
]
extends = [
  "core/recommended",
  "design/recommended",
  "testing/recommended",
  "go/recommended",
  "markdown/recommended",
]

# Dependency rules of docs/architecture.md as a `design/layers` contract.
# Layers read top down: a package imports its own layer and the ones below,
# and peers in different globs of one layer stay independent. Module labels
# are package directories relative to the repository root.
[spec.rules."design/layers"]
level = "error"
options.forbidden = [
  { from = "token/**", to = "github.com/siyul-park/minivm/**" },
  { from = "scanner/**", to = "github.com/siyul-park/minivm/**" },
  { from = "ast/**", to = "github.com/siyul-park/minivm/**" },
  { from = "parser/**", to = "github.com/siyul-park/minivm/**" },
  { from = "types/**", to = "github.com/siyul-park/minivm/**" },
  { from = "ssa/**", to = "github.com/siyul-park/minivm/**" },
  { from = "optimize/**", to = "github.com/siyul-park/minivm/**" },
  { from = "internal/cpython/**", to = "github.com/siyul-park/minivm/**" },
  { from = "conformance/**", to = "github.com/siyul-park/minivm/**" },
  { from = "benchmarks/**", to = "github.com/siyul-park/minivm/**" },
]
options.layers = [
  ["cmd/spry/**"],
  ["cli/**"],
  ["compiler/**"],
  ["builtins/**", "optimize/**"],
  ["ssa/**"],
  ["types/**"],
  ["parser/**"],
  ["scanner/**", "ast/**"],
  ["token/**"],
]

[spec.rules]
# Files follow Go standard-library layout (one file per responsibility, as in
# go/scanner/scanner.go or go/parser/parser.go), so size is not a split signal.
"core/max-lines" = "off"

# docs/coding-patterns.md "File Order" (same groups as
# https://github.com/siyul-park/minivm): public options and functions come
# before the constructors and methods of the types; public constructors, then
# public methods, then interface hooks across types; private functions, private
# constructors and private methods stay together, callers before their helpers.
"design/declaration-groups" = { level = "error", options = { groups = ["public-type", "private-type", "public-const", "private-const", "var", "init", "public-function", "method", "private"], blocks = "kind", hooks = ["String", "GoString", "Error", "Unwrap", "Is", "MarshalJSON", "UnmarshalJSON", "MarshalText", "UnmarshalText"] } }

# Python programs under these paths are test data and benchmark kernels, not
# product code: the harness calls `run` by name, and the kernels keep the
# signatures of the published benchmark programs.
[[spec.overrides]]
files = ["benchmarks/fixtures/*.py", "conformance/testdata/**/*.py", "**/testdata/**/*.py"]
rules = { "design/no-unused-symbol" = "off", "testing/no-missing-owner" = "off", "design/signature-size" = "off", "design/exported-doc" = "off", "design/complexity" = "off" }

# Oracle drivers are scripts run by name from internal/cpython (driver.go); the
# Go tests of that package are their owner tests, and they are not an API.
[[spec.overrides]]
files = ["internal/cpython/driver/*.py"]
rules = { "testing/no-missing-owner" = "off", "design/exported-doc" = "off" }

# Each parser function mirrors one rule of CPython's Grammar/python.gram, and a
# rule with many alternatives (try_stmt, except_block, import_from, arguments,
# the invalid_* rules, ...) legitimately calls one sub-rule per alternative.
# Splitting them would diverge from the grammar the parser is verified against,
# so the fan-out warning is off for this file only.
[[spec.overrides]]
files = ["parser/parser.go"]
rules = { "design/coupling" = "off" }
